name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions: {}

jobs:
  integration-tests:
    name: integration tests
    # Live tests mutate a real account; run explicitly with a dedicated test account.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run integration tests
        working-directory: ansible_collections/vic1707/purelymail
        env:
          PURELYMAIL_API_TOKEN: ${{ secrets.PURELYMAIL_API_TOKEN }}
          PURELYMAIL_DOMAIN: ${{ vars.PURELYMAIL_DOMAIN }}
          PURELYMAIL_USER_PASSWORD: ${{ secrets.PURELYMAIL_USER_PASSWORD }}
        run: |
          mise exec -- python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = {key: os.environ[key] for key in ("PURELYMAIL_API_TOKEN", "PURELYMAIL_DOMAIN", "PURELYMAIL_USER_PASSWORD")}
          assert all(config.values()), "Configure the dedicated Purelymail test account first"
          config["PURELYMAIL_API_TLS_VERIFY"] = True
          Path("tests/integration/integration_config.yml").write_text(yaml.safe_dump(config))
          PY
          mise exec -- ansible-test integration --coverage --python-interpreter "$(mise which python)"

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run unit tests
        run: mise unit-tests
